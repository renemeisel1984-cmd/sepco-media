<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flexible-drive hold cleaner illustration">
  <defs>
    <linearGradient id="hc-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2a31"/><stop offset="1" stop-color="#17171b"/></linearGradient>
    <linearGradient id="hc-steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6c6c79"/><stop offset="1" stop-color="#3a3a44"/></linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#hc-bg)"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- drive motor -->
    <rect x="276" y="116" width="92" height="64" rx="16" fill="url(#hc-steel)" stroke="#9a9aa6" stroke-width="2"/>
    <g stroke="#2a2a31" stroke-width="3"><line x1="300" y1="128" x2="300" y2="168"/><line x1="314" y1="128" x2="314" y2="168"/><line x1="328" y1="128" x2="328" y2="168"/></g>
    <circle cx="352" cy="148" r="8" fill="#cf2e2e"/>
    <!-- flexible shaft (coil) -->
    <path d="M276 150 q-30 0 -40 24 q-12 28 -44 30 q-30 2 -40 24" fill="none" stroke="#cf2e2e" stroke-width="8" opacity="0.9"/>
    <path d="M276 150 q-30 0 -40 24 q-12 28 -44 30 q-30 2 -40 24" fill="none" stroke="#7a1b18" stroke-width="2" stroke-dasharray="2 8"/>
    <!-- cleaning head -->
    <circle cx="92" cy="216" r="26" fill="#4a4a55" stroke="#9a9aa6" stroke-width="2"/>
    <g stroke="#cdd0d6" stroke-width="3">
      <line x1="92" y1="216" x2="92" y2="184"/><line x1="92" y1="216" x2="124" y2="216"/>
      <line x1="92" y1="216" x2="92" y2="248"/><line x1="92" y1="216" x2="60" y2="216"/>
      <line x1="92" y1="216" x2="115" y2="193"/><line x1="92" y1="216" x2="69" y2="239"/>
    </g>
    <circle cx="92" cy="216" r="6" fill="#cf2e2e"/>
  </g>
  <g opacity="0.5"><rect x="0" y="288" width="400" height="12" fill="#cf2e2e"/></g>
</svg>
