<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Needle and chisel scaler kit in case illustration">
  <defs>
    <linearGradient id="nk-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2a31"/><stop offset="1" stop-color="#17171b"/></linearGradient>
    <linearGradient id="nk-case" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3a44"/><stop offset="1" stop-color="#26262d"/></linearGradient>
    <linearGradient id="nk-steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6c6c79"/><stop offset="1" stop-color="#3a3a44"/></linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#nk-bg)"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- case -->
    <rect x="70" y="96" width="260" height="150" rx="14" fill="url(#nk-case)" stroke="#9a9aa6" stroke-width="2"/>
    <rect x="70" y="96" width="260" height="34" rx="14" fill="#cf2e2e" opacity="0.85"/>
    <rect x="186" y="84" width="28" height="14" rx="4" fill="#4a4a55" stroke="#9a9aa6" stroke-width="2"/>
    <!-- foam slots -->
    <rect x="92" y="146" width="120" height="40" rx="6" fill="#1d1d22" stroke="#454550" stroke-width="1.5"/>
    <rect x="92" y="194" width="120" height="36" rx="6" fill="#1d1d22" stroke="#454550" stroke-width="1.5"/>
    <rect x="224" y="146" width="84" height="84" rx="6" fill="#1d1d22" stroke="#454550" stroke-width="1.5"/>
    <!-- scaler in slot -->
    <rect x="104" y="156" width="96" height="20" rx="9" fill="url(#nk-steel)" stroke="#9a9aa6" stroke-width="2"/>
    <circle cx="126" cy="166" r="5" fill="#cf2e2e"/>
    <!-- chisels -->
    <g fill="#cdd0d6" stroke="#9a9aa6" stroke-width="1.5">
      <rect x="104" y="204" width="54" height="9" rx="3"/>
      <rect x="104" y="216" width="54" height="9" rx="3"/>
    </g>
    <!-- needles bundle -->
    <g stroke="#cdd0d6" stroke-width="2">
      <line x1="236" y1="162" x2="296" y2="162"/><line x1="236" y1="170" x2="296" y2="170"/>
      <line x1="236" y1="178" x2="296" y2="178"/><line x1="236" y1="186" x2="296" y2="186"/>
      <line x1="236" y1="194" x2="296" y2="194"/><line x1="236" y1="202" x2="296" y2="202"/>
    </g>
  </g>
  <g opacity="0.5"><rect x="0" y="288" width="400" height="12" fill="#cf2e2e"/></g>
</svg>
