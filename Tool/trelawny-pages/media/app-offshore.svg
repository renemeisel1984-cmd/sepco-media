<svg viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Offshore oil and gas">
  <defs>
    <linearGradient id="ao-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2a31"/><stop offset="1" stop-color="#17171b"/></linearGradient>
    <linearGradient id="ao-steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a5a66"/><stop offset="1" stop-color="#3a3a44"/></linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#ao-bg)"/>
  <path d="M0 196 q80 8 160 0 t160 0 t80 0 v44 H0 Z" fill="#cf2e2e" opacity="0.12"/>
  <path d="M0 196 q80 8 160 0 t160 0 t80 0" fill="none" stroke="#cf2e2e" stroke-width="2" opacity="0.45"/>
  <g stroke-linecap="round" stroke-linejoin="round">
