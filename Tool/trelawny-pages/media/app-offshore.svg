    <g stroke="url(#ao-steel)" stroke-width="9" fill="none"><line x1="120" y1="120" x2="108" y2="210"/><line x1="280" y1="120" x2="292" y2="210"/><line x1="180" y1="120" x2="180" y2="210"/><line x1="240" y1="120" x2="240" y2="210"/></g>
    <g stroke="#52525b" stroke-width="3"><line x1="112" y1="165" x2="288" y2="165"/><line x1="120" y1="120" x2="240" y2="210"/><line x1="280" y1="120" x2="180" y2="210"/></g>
    <!-- deck -->
    <rect x="96" y="96" width="208" height="28" rx="4" fill="url(#ao-steel)" stroke="#9a9aa6" stroke-width="2"/>
    <!-- derrick -->
    <path d="M150 96 L168 30 L196 30 L214 96 Z" fill="none" stroke="#9a9aa6" stroke-width="3"/>
    <line x1="160" y1="68" x2="204" y2="68" stroke="#9a9aa6" stroke-width="2"/>
    <!-- flare -->
    <circle cx="262" cy="78" r="6" fill="#f6b935"/>
    <path d="M262 72 q6 -10 0 -18" fill="none" stroke="#cf2e2e" stroke-width="3"/>
  </g>
</svg>
