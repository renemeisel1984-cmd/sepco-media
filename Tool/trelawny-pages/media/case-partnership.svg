<svg viewBox="0 0 480 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SepcoTech and Trelawny partnership reducing HAVS risk">
  <defs>
    <linearGradient id="cp-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#33333b"/><stop offset="1" stop-color="#19191d"/></linearGradient>
    <linearGradient id="cp-steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#74747f"/><stop offset="1" stop-color="#3a3a44"/></linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#cp-bg)"/>
  <!-- two interlocking gears = partnership -->
  <g transform="translate(176 120)">
    <g fill="#6c6c79" stroke="#9a9aa6" stroke-width="2">
      <g>
        <circle r="52"/>
        <g><rect x="-7" y="-66" width="14" height="18" rx="2"/><rect x="-7" y="48" width="14" height="18" rx="2"/><rect x="-66" y="-7" width="18" height="14" rx="2"/><rect x="48" y="-7" width="18" height="14" rx="2"/>
        <rect x="-7" y="-66" width="14" height="18" rx="2" transform="rotate(45)"/><rect x="-7" y="48" width="14" height="18" rx="2" transform="rotate(45)"/><rect x="-66" y="-7" width="18" height="14" rx="2" transform="rotate(45)"/><rect x="48" y="-7" width="18" height="14" rx="2" transform="rotate(45)"/></g>
      </g>
    </g>
    <circle r="20" fill="#19191d" stroke="#9a9aa6" stroke-width="2"/>
  </g>
  <g transform="translate(300 168)">
    <g fill="#cf2e2e" stroke="#7a1b18" stroke-width="2">
      <circle r="44"/>
      <g><rect x="-6" y="-56" width="12" height="16" rx="2"/><rect x="-6" y="40" width="12" height="16" rx="2"/><rect x="-56" y="-6" width="16" height="12" rx="2"/><rect x="40" y="-6" width="16" height="12" rx="2"/>
      <rect x="-6" y="-56" width="12" height="16" rx="2" transform="rotate(45)"/><rect x="-6" y="40" width="12" height="16" rx="2" transform="rotate(45)"/><rect x="-56" y="-6" width="16" height="12" rx="2" transform="rotate(45)"/><rect x="40" y="-6" width="16" height="12" rx="2" transform="rotate(45)"/></g>
    </g>
    <circle r="16" fill="#19191d" stroke="#7a1b18" stroke-width="2"/>
  </g>
  <!-- low-vibration motif: damped waves -->
  <g stroke="#f6b935" stroke-width="3" fill="none" opacity="0.9" stroke-linecap="round">
    <path d="M70 250 q12 -22 24 0 q12 16 24 0 q12 -10 24 0 q12 -6 24 0"/>
  </g>
  <text x="70" y="232" fill="#dfe2e8" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800">Lower vibration. Same bite.</text>
