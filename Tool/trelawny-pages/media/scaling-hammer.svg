<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pneumatic scaling hammer illustration">
  <defs>
    <linearGradient id="sh-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2a31"/><stop offset="1" stop-color="#17171b"/></linearGradient>
    <linearGradient id="sh-steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6c6c79"/><stop offset="1" stop-color="#3a3a44"/></linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#sh-bg)"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- chisel -->
    <path d="M60 150 L120 140 L120 160 Z" fill="#cdd0d6" stroke="#9a9aa6" stroke-width="2"/>
    <rect x="118" y="138" width="26" height="24" rx="4" fill="#4a4a55" stroke="#9a9aa6" stroke-width="2"/>
    <!-- barrel body (inline) -->
    <rect x="144" y="128" width="150" height="44" rx="20" fill="url(#sh-steel)" stroke="#9a9aa6" stroke-width="2"/>
    <line x1="170" y1="138" x2="170" y2="162" stroke="#2a2a31" stroke-width="3"/>
    <line x1="182" y1="138" x2="182" y2="162" stroke="#2a2a31" stroke-width="3"/>
    <line x1="194" y1="138" x2="194" y2="162" stroke="#2a2a31" stroke-width="3"/>
    <circle cx="250" cy="150" r="9" fill="#cf2e2e"/>
    <!-- rear handle / throttle -->
    <rect x="294" y="132" width="40" height="36" rx="12" fill="url(#sh-steel)" stroke="#9a9aa6" stroke-width="2"/>
    <path d="M310 168 q-6 18 6 30" fill="none" stroke="#cf2e2e" stroke-width="6"/>
    <!-- air hose -->
    <path d="M334 150 q34 -4 34 26 q0 24 -26 28" fill="none" stroke="#cf2e2e" stroke-width="6" opacity="0.9"/>
  </g>
  <g opacity="0.5"><rect x="0" y="288" width="400" height="12" fill="#cf2e2e"/></g>
</svg>
