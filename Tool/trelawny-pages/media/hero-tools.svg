<svg viewBox="0 0 480 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Surface preparation on a steel hull">
  <defs>
    <linearGradient id="ht-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#33333b"/><stop offset="1" stop-color="#19191d"/></linearGradient>
    <linearGradient id="ht-steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#74747f"/><stop offset="1" stop-color="#3a3a44"/></linearGradient>
    <linearGradient id="ht-plate" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f2f37"/><stop offset="1" stop-color="#3c3c46"/></linearGradient>
  </defs>
  <rect width="480" height="360" fill="url(#ht-bg)"/>
  <!-- steel hull plate with rivets -->
  <rect x="40" y="210" width="400" height="120" rx="8" fill="url(#ht-plate)" stroke="#4a4a55" stroke-width="2"/>
  <g fill="#52525b">
    <circle cx="70" cy="240" r="4"/><circle cx="70" cy="300" r="4"/>
    <circle cx="410" cy="240" r="4"/><circle cx="410" cy="300" r="4"/>
  </g>
  <!-- rust patch being cleaned (red -> clean) -->
  <path d="M150 250 q40 -16 90 0 q40 16 90 4 l0 60 l-180 0 Z" fill="#7a2b1f" opacity="0.55"/>
  <path d="M150 250 q40 -16 90 0 l-10 60 l-80 0 Z" fill="#2f2f37" opacity="0.9"/>
  <!-- clean swept band -->
  <g stroke="#cdd0d6" stroke-width="2" opacity="0.5">
    <line x1="160" y1="270" x2="210" y2="270"/><line x1="160" y1="282" x2="205" y2="282"/><line x1="160" y1="294" x2="208" y2="294"/>
  </g>

  <!-- needle scaler working the plate -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#dfe2e8" stroke-width="3">
      <line x1="206" y1="250" x2="248" y2="222"/><line x1="212" y1="256" x2="254" y2="228"/>
      <line x1="200" y1="244" x2="242" y2="216"/><line x1="218" y1="262" x2="260" y2="234"/>
    </g>
    <rect x="246" y="196" width="40" height="56" rx="10" fill="url(#ht-steel)" stroke="#9a9aa6" stroke-width="2" transform="rotate(34 266 224)"/>
    <rect x="276" y="166" width="118" height="56" rx="16" fill="url(#ht-steel)" stroke="#9a9aa6" stroke-width="2" transform="rotate(34 335 194)"/>
    <circle cx="300" cy="208" r="9" fill="#cf2e2e"/>
    <!-- grip -->
    <path d="M330 226 q34 30 14 64 q-10 16 -30 10" fill="none" stroke="url(#ht-steel)" stroke-width="22"/>
    <path d="M330 226 q34 30 14 64 q-10 16 -30 10" fill="none" stroke="#9a9aa6" stroke-width="2"/>
    <!-- air hose sweeping up -->
    <path d="M378 150 q56 -30 60 -90 q2 -40 -30 -56" fill="none" stroke="#cf2e2e" stroke-width="7" opacity="0.9"/>
  </g>

  <!-- impact sparks -->
  <g stroke="#f6b935" stroke-width="3" opacity="0.95" stroke-linecap="round">
    <line x1="196" y1="244" x2="178" y2="236"/><line x1="200" y1="256" x2="184" y2="262"/><line x1="190" y1="250" x2="172" y2="250"/>
  </g>
</svg>
