<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="RO-RO freight vessel">
  <defs>
    <linearGradient id="cr-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2a31"/><stop offset="1" stop-color="#17171b"/></linearGradient>
    <linearGradient id="cr-hull" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a5a66"/><stop offset="1" stop-color="#3a3a44"/></linearGradient>
  </defs>
  <rect width="400" height="220" fill="url(#cr-bg)"/>
  <path d="M0 168 q70 10 140 0 t140 0 t120 0 v52 H0 Z" fill="#cf2e2e" opacity="0.13"/>
  <path d="M0 168 q70 10 140 0 t140 0 t120 0" fill="none" stroke="#cf2e2e" stroke-width="2" opacity="0.45"/>
  <g stroke-linejoin="round">
    <!-- big boxy RO-RO hull -->
    <path d="M48 96 L330 96 L312 168 L74 168 Z" fill="url(#cr-hull)" stroke="#9a9aa6" stroke-width="2"/>
    <rect x="48" y="60" width="220" height="38" fill="#4a4a55" stroke="#9a9aa6" stroke-width="2"/>
    <!-- windows -->
    <g fill="#cf2e2e" opacity="0.8"><rect x="64" y="72" width="16" height="12"/><rect x="88" y="72" width="16" height="12"/><rect x="112" y="72" width="16" height="12"/></g>
    <!-- stern ramp -->
    <path d="M330 96 L376 150 L330 150 Z" fill="#6c6c79" stroke="#9a9aa6" stroke-width="2"/>
    <!-- truck driving up -->
    <g stroke="#9a9aa6" stroke-width="1.5"><rect x="300" y="118" width="34" height="20" fill="#cf2e2e" opacity="0.85"/><rect x="326" y="124" width="14" height="14" fill="#6c6c79"/></g>
    <circle cx="308" cy="142" r="5" fill="#19191d" stroke="#9a9aa6" stroke-width="2"/>
    <circle cx="330" cy="142" r="5" fill="#19191d" stroke="#9a9aa6" stroke-width="2"/>
  </g>
</svg>
