<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pneumatic angle grinder illustration">
  <defs>
    <linearGradient id="ag-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2a31"/><stop offset="1" stop-color="#17171b"/></linearGradient>
    <linearGradient id="ag-steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6c6c79"/><stop offset="1" stop-color="#3a3a44"/></linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#ag-bg)"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- body -->
    <rect x="170" y="130" width="150" height="44" rx="22" fill="url(#ag-steel)" stroke="#9a9aa6" stroke-width="2"/>
    <!-- vents -->
    <g stroke="#2a2a31" stroke-width="3"><line x1="250" y1="140" x2="250" y2="164"/><line x1="262" y1="140" x2="262" y2="164"/><line x1="274" y1="140" x2="274" y2="164"/></g>
    <circle cx="300" cy="152" r="8" fill="#cf2e2e"/>
    <!-- gear head -->
    <rect x="150" y="122" width="34" height="60" rx="10" fill="#4a4a55" stroke="#9a9aa6" stroke-width="2"/>
    <!-- guard -->
    <path d="M150 152 a40 40 0 0 0 -40 40 l40 0 Z" fill="#4a4a55" stroke="#9a9aa6" stroke-width="2"/>
    <!-- disc -->
    <circle cx="116" cy="196" r="42" fill="#2a2a31" stroke="#cf2e2e" stroke-width="5"/>
    <circle cx="116" cy="196" r="10" fill="url(#ag-steel)" stroke="#9a9aa6" stroke-width="2"/>
    <!-- spark accents -->
    <g stroke="#f6b935" stroke-width="3" opacity="0.9"><line x1="92" y1="232" x2="78" y2="248"/><line x1="108" y1="238" x2="102" y2="258"/><line x1="124" y1="236" x2="130" y2="254"/></g>
    <!-- air hose -->
    <path d="M320 152 q34 0 34 30 q0 24 -26 28" fill="none" stroke="#cf2e2e" stroke-width="6" opacity="0.9"/>
  </g>
  <g opacity="0.5"><rect x="0" y="288" width="400" height="12" fill="#cf2e2e"/></g>
</svg>
