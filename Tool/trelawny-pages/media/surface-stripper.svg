<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Long-reach surface stripper illustration">
  <defs>
    <linearGradient id="ss-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2a31"/><stop offset="1" stop-color="#17171b"/></linearGradient>
    <linearGradient id="ss-steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6c6c79"/><stop offset="1" stop-color="#3a3a44"/></linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#ss-bg)"/>
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- long pole -->
    <rect x="120" y="70" width="200" height="14" rx="7" fill="url(#ss-steel)" stroke="#9a9aa6" stroke-width="2" transform="rotate(28 220 77)"/>
    <!-- rear grip + trigger -->
    <rect x="296" y="150" width="40" height="30" rx="10" fill="url(#ss-steel)" stroke="#9a9aa6" stroke-width="2" transform="rotate(28 316 165)"/>
    <path d="M300 182 q-4 14 8 22" fill="none" stroke="#cf2e2e" stroke-width="6"/>
    <!-- air hose -->
    <path d="M330 176 q30 6 24 32" fill="none" stroke="#cf2e2e" stroke-width="6" opacity="0.9"/>
    <!-- front: scraper blade head -->
    <rect x="86" y="118" width="30" height="26" rx="5" fill="#4a4a55" stroke="#9a9aa6" stroke-width="2" transform="rotate(28 101 131)"/>
    <path d="M58 150 L96 132 L104 150 L66 168 Z" fill="#cdd0d6" stroke="#9a9aa6" stroke-width="2"/>
    <!-- lifted coating curl -->
    <path d="M58 150 q-22 6 -30 -10 q14 4 18 -8" fill="none" stroke="#cf2e2e" stroke-width="4" opacity="0.85"/>
  </g>
  <g opacity="0.5"><rect x="0" y="288" width="400" height="12" fill="#cf2e2e"/></g>
</svg>
